# Use Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# disable mouse support
set -g mouse off
# Start windows and panes numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Easier pane splitting
bind | split-window -h
bind - split-window -v

# panel navigation
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Increase scrollback history
set -g history-limit 10000

# Better terminal colors. "tmux-256color" (not "screen-256color") is what
# advertises italics and true color, which the prompt and $EDITOR both use.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set-window-option -g xterm-keys on

# Inactive panes sit on a lighter background so the active one reads first.
set -g window-active-style 'bg=#1b1e20,fg=#d8d2c6'
set -g window-style 'bg=#24282a,fg=#9a958c'
set -g pane-border-style 'fg=#2f3437'
set -g pane-active-border-style 'fg=#f3a90a'

# Status bar: amber session chunk on the left, dim clock on the right.
set -g status-style 'bg=#24282a,fg=#9a958c'
set -g status-left-length 30
set -g status-left "#[bg=#f3a90a,fg=#1b1e20,bold]  #S #[bg=#24282a,fg=#f3a90a,nobold]"
set -g status-right "#[fg=#5a6063]%Y-%m-%d #[fg=#d8d2c6]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#f3a90a,bold] #I:#W #[nobold]"
set -g message-style 'bg=#f3a90a,fg=#1b1e20'
